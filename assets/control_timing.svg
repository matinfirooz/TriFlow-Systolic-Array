<text x="34" y="38" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#202832">(d) Command controller — state, counters, and output gating</text>
<text x="34" y="68" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#66717d">Dashed signals are enables, mode, and terminal flags.  pause holds the active state and counters and suppresses datapath updates.</text>
