<text x="35" y="972" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#66717d">State encodings: IDLE=0, CLEAR=1, PRELOAD=2, COMPUTE=3, DONE=4. Core DONE marks final C capture; the simple top registers notification.</text>
